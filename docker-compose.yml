# Kompletno okruzenje aplikacije: baza podataka i sama aplikacija.
#
# Pokretanje:             docker compose up --build
# Punjenje demo podacima: npm run db:seed   (sa host masine, preko porta 5433)
# Gasenje:                docker compose down
#
# Aplikacija je posle pokretanja dostupna na http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    container_name: ekarton-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ekarton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekarton}
      POSTGRES_DB: ${POSTGRES_DB:-ekarton}
    ports:
      # Baza je izlozena na host masini da bi Prisma CLI mogao da se povezuje sa nje.
      # Koristi se 5433 jer je 5432 cesto vec zauzet lokalno instaliranim PostgreSQL-om.
      - '5433:5432'
    volumes:
      # Imenovani volumen cuva podatke i posle gasenja kontejnera.
      - ekarton-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ekarton} -d ${POSTGRES_DB:-ekarton}']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekarton-app
    restart: unless-stopped
    depends_on:
      db:
        # Aplikacija ceka da baza bude STVARNO spremna, a ne samo pokrenuta.
        # Bez ovoga bi migracije pukle jer Postgres jos ne prima konekcije.
        condition: service_healthy
    environment:
      # Unutar Docker mreze servisi se nalaze po imenu, pa je host "db",
      # a port 5432 (interni port kontejnera, ne 5433 sa host masine).
      DATABASE_URL: postgresql://${POSTGRES_USER:-ekarton}:${POSTGRES_PASSWORD:-ekarton}@db:5432/${POSTGRES_DB:-ekarton}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Postavite NEXTAUTH_SECRET u .env fajlu}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - '3000:3000'
    # Migracije se primenjuju pri svakom pokretanju, pa je baza uvek uskladjena
    # sa semom. "migrate deploy" samo primenjuje postojece migracije i nikada
    # ne brise podatke - zato je bezbedan za produkciju.
    command: >
      sh -c "node node_modules/prisma/build/index.js migrate deploy && node server.js"

volumes:
  ekarton-db-data:
