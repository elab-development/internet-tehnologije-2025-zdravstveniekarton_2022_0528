name: CI

# Pipeline se pokrece pri svakom guranju koda i pri svakom pull request-u
# ka stabilnim granama. Tako se greska otkriva pre nego sto stigne u main.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Ako se na istu granu gurne novi komit dok prethodni pipeline jos radi,
# stari se prekida - nema smisla trositi vreme na zastareo kod.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 1. Provera kvaliteta koda ----------
  lint:
    name: Lint i provera tipova
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Kesiranje npm paketa - sledeca pokretanja su znatno brza.
          cache: npm

      - name: Instalacija paketa
        run: npm ci

      # Prisma klijent se generise iz seme; bez njega TypeScript ne poznaje
      # modele i provera tipova bi pukla.
      - name: Generisanje Prisma klijenta
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: Provera TypeScript tipova
        run: npm run type-check

      - name: Provera formatiranja koda
        run: npm run format:check

  # ---------- 2. Automatizovani testovi ----------
  test:
    name: Testovi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalacija paketa
        run: npm ci

      - name: Generisanje Prisma klijenta
        run: npx prisma generate

      # Testovi su unit testovi nad cistim funkcijama i komponentama,
      # pa im baza podataka nije potrebna.
      - name: Pokretanje testova
        run: npm test -- --coverage

      - name: Cuvanje izvestaja o pokrivenosti koda
        uses: actions/upload-artifact@v4
        # Izvestaj se cuva i kada testovi padnu - tada je i najpotrebniji.
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ---------- 3. Produkcioni build ----------
  build:
    name: Build aplikacije
    runs-on: ubuntu-latest
    # Nema smisla graditi kod koji ne prolazi lint i testove.
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalacija paketa
        run: npm ci

      - name: Build
        # Vrednosti su lazne i sluze samo da build prodje. Next.js pri build-u
        # ne otvara konekciju ka bazi, a prave tajne se cuvaju u Vercel-u.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXTAUTH_URL: http://localhost:3000
        run: npm run build

  # ---------- 4. Provera Docker slike ----------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Priprema Docker Buildx alata
        uses: docker/setup-buildx-action@v3

      - name: Build Docker slike
        uses: docker/build-push-action@v6
        with:
          context: .
          # Slika se samo gradi radi provere; ne salje se u registry,
          # jer se aplikacija na Vercel deploy-uje iz izvornog koda.
          push: false
          tags: zdravstveni-ekarton:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
